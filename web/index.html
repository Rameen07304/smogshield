<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SmogShield | Live air quality</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="offline" class="banner banner--offline" role="status" hidden></div>

  <main id="content" class="page">
    <!-- 2. Hero: current air quality -->
    <section id="hero" class="card hero" data-level="loading" aria-labelledby="hero-label">
      <div class="hero__level">
        <p id="hero-label" class="hero__label">AQI (hourly PM2.5 estimate)</p>
        <p id="hero-aqi" class="hero__aqi">--</p>
        <p id="hero-category" class="hero__category">Loading…</p>
      </div>
      <div class="hero__body">
        <p id="hero-place" class="hero__place">Loading live air quality…</p>
        <p id="hero-summary" class="hero__summary">Fetching the latest readings.</p>
        <div class="scale" aria-hidden="true">
          <div class="scale__bar">
            <span style="--w: 50" data-level="good"></span>
            <span style="--w: 50" data-level="moderate"></span>
            <span style="--w: 50" data-level="unhealthy_sensitive"></span>
            <span style="--w: 50" data-level="unhealthy"></span>
            <span style="--w: 100" data-level="very_unhealthy"></span>
            <span style="--w: 200" data-level="hazardous"></span>
            <i id="scale-marker" class="scale__marker" hidden></i>
          </div>
          <div class="scale__labels">
            <span style="--w: 50">Good</span><span style="--w: 50">Mod.</span><span style="--w: 50">Sens.</span>
            <span style="--w: 50">Unh.</span><span style="--w: 100">Very unh.</span><span style="--w: 200">Hazardous</span>
          </div>
        </div>
        <p id="hero-facts" class="hero__facts"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    Air quality data: <a href="https://open-meteo.com">Open-Meteo</a>, based on CAMS ENSEMBLE data
    (Copernicus Atmosphere Monitoring Service).
  </footer>
</body>
</html>
